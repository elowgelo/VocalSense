<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Daftar — VocalSense AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,400;0,500;0,600;0,700;0,800;1,400&family=JetBrains+Mono:ital,wght@0,400;0,500;0,600;0,700;1,400&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="../css/style.css" />
  <style>
    .auth-page {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 5rem 1.5rem 2rem;
      background: var(--bg);
    }
    .auth-box {
      width: 100%; max-width: 460px;
      background: #ffffff; border: 1px solid var(--border-dark);
      border-radius: var(--radius-sm); padding: 2rem;
      box-shadow: var(--shadow);
    }
    .auth-logo {
      display: flex; align-items: center; gap: 10px;
      justify-content: center; margin-bottom: 1.25rem;
    }
    .auth-logo .logo-icon {
      width: 36px; height: 36px; border: 1px solid var(--border-dark);
      background: var(--text); color: #fff;
      display: flex; align-items: center; justify-content: center; font-size: 0.9rem; font-weight: 700;
    }
    .auth-title { font-size: 1.25rem; font-weight: 800; text-align: center; margin-bottom: 0.25rem; }
    .auth-sub { color: var(--text2); font-size: 0.85rem; text-align: center; margin-bottom: 1.5rem; }
    .oauth-btn {
      width: 100%; padding: 0.65rem; border-radius: var(--radius-sm);
      background: #ffffff; border: 1px solid var(--border-dark); color: var(--text);
      display: flex; align-items: center; justify-content: center; gap: 0.75rem;
      font-size: 0.85rem; font-weight: 600; cursor: pointer;
    }
    .oauth-btn:hover { background: var(--bg2); }
    .btn-full { width: 100%; justify-content: center; padding: 0.75rem; font-size: 0.9rem; }
    .auth-footer { text-align: center; margin-top: 1.25rem; font-size: 0.85rem; color: var(--text2); }
    .auth-footer a { color: var(--text); font-weight: 700; text-decoration: underline; }
    .tier-select-row {
      display: grid; grid-template-columns: repeat(3, 1fr); gap: 0.75rem; margin-bottom: 1.25rem;
    }
    .tier-option {
      border: 1px solid var(--border-dark); border-radius: var(--radius-sm); padding: 0.85rem 0.5rem;
      text-align: center; cursor: pointer; background: #fff;
    }
    .tier-option:hover { background: var(--bg2); }
    .tier-option.selected { border-color: var(--text); border-width: 2px; background: var(--bg2); }
    .tier-option .tier-name { font-size: 0.85rem; font-weight: 700; margin-top: 0.35rem; }
    .tier-option .tier-price { font-size: 0.75rem; color: var(--text2); }
  </style>
</head>
<body>
<nav class="navbar">
  <a href="../index.html" class="navbar-brand">
    <div class="logo-icon">VS</div>
    <span>VocalSense AI</span>
  </a>
  <div class="navbar-actions">
    <a href="login.html" class="btn btn-outline btn-sm">Masuk</a>
  </div>
</nav>

<div class="auth-page">
  <div class="auth-box">
    <div class="auth-logo">
      <div class="logo-icon">VS</div>
      <span style="font-size:1.2rem;font-weight:700">VocalSense AI</span>
    </div>
    <h1 class="auth-title">Buat Akun Baru</h1>
    <p class="auth-sub">Mulai perjalanan vokalmu hari ini</p>

    <div id="alertBox" class="alert alert-error hidden mb-3"></div>
    <div id="successBox" class="alert alert-success hidden mb-3"></div>

    <button class="oauth-btn mb-2" onclick="registerWithGoogle()">
      <svg width="18" height="18" viewBox="0 0 18 18"><path fill="#4285F4" d="M17.64 9.2c0-.637-.057-1.251-.164-1.84H9v3.481h4.844c-.209 1.125-.843 2.078-1.796 2.717v2.258h2.908c1.702-1.567 2.684-3.874 2.684-6.615z"/><path fill="#34A853" d="M9 18c2.43 0 4.467-.806 5.956-2.18l-2.908-2.259c-.806.54-1.837.86-3.048.86-2.344 0-4.328-1.584-5.036-3.711H.957v2.332A8.997 8.997 0 0 0 9 18z"/><path fill="#FBBC05" d="M3.964 10.71A5.41 5.41 0 0 1 3.682 9c0-.593.102-1.17.282-1.71V4.958H.957A8.996 8.996 0 0 0 0 9c0 1.452.348 2.827.957 4.042l3.007-2.332z"/><path fill="#EA4335" d="M9 3.58c1.321 0 2.508.454 3.44 1.345l2.582-2.58C13.463.891 11.426 0 9 0A8.997 8.997 0 0 0 .957 4.958L3.964 7.29C4.672 5.163 6.656 3.58 9 3.58z"/></svg>
      Daftar dengan Google
    </button>

    <div class="divider">atau daftar dengan email</div>

    <form id="registerForm" onsubmit="handleRegister(event)">
      <div class="form-group">
        <label class="form-label">Nama Lengkap</label>
        <input type="text" id="name" class="form-control" placeholder="Nama Lengkap" required />
      </div>
      <div class="form-group">
        <label class="form-label">Email</label>
        <input type="email" id="email" class="form-control" placeholder="nama@email.com" required />
      </div>
      <div class="form-group">
        <label class="form-label">Kata Sandi</label>
        <input type="password" id="password" class="form-control" placeholder="Minimal 6 karakter" required minlength="6" />
        <div class="form-hint">Minimal 6 karakter</div>
      </div>
      <div class="form-group">
        <label class="form-label">Konfirmasi Kata Sandi</label>
        <input type="password" id="confirm" class="form-control" placeholder="Ulangi kata sandi" required />
      </div>

      <div class="form-group">
        <label class="form-label">Pilih Paket</label>
        <div class="tier-select-row">
          <div class="tier-option selected" onclick="selectTier('free', this)">
            <div>🎤</div>
            <div class="tier-name">Free</div>
            <div class="tier-price">Gratis</div>
          </div>
          <div class="tier-option" onclick="selectTier('pro', this)">
            <div>⭐</div>
            <div class="tier-name">Pro</div>
            <div class="tier-price">Rp 49.000/bln</div>
          </div>
          <div class="tier-option" onclick="selectTier('premium', this)">
            <div>👑</div>
            <div class="tier-name">Premium</div>
            <div class="tier-price">Rp 99.000/bln</div>
          </div>
        </div>
        <input type="hidden" id="selectedTier" value="free" />
      </div>

      <button type="submit" class="btn btn-primary btn-full" id="submitBtn">
        Buat Akun
      </button>
    </form>

    <div class="auth-footer">
      Sudah punya akun? <a href="login.html">Masuk sekarang</a>
    </div>
  </div>
</div>

<script>
  function selectTier(tier, el) {
    document.querySelectorAll('.tier-option').forEach(o => o.classList.remove('selected'));
    el.classList.add('selected');
    document.getElementById('selectedTier').value = tier;
  }

  function showAlert(msg, type = 'error') {
    const alertEl = document.getElementById('alertBox');
    const successEl = document.getElementById('successBox');
    alertEl.classList.add('hidden');
    successEl.classList.add('hidden');
    if (type === 'success') {
      successEl.textContent = msg;
      successEl.classList.remove('hidden');
    } else {
      alertEl.textContent = msg;
      alertEl.classList.remove('hidden');
    }
  }

  function handleRegister(e) {
    e.preventDefault();
    const name = document.getElementById('name').value.trim();
    const email = document.getElementById('email').value.trim();
    const password = document.getElementById('password').value;
    const confirm = document.getElementById('confirm').value;
    const tier = document.getElementById('selectedTier').value;
    const btn = document.getElementById('submitBtn');

    if (password !== confirm) {
      showAlert('Kata sandi tidak cocok.');
      return;
    }
    if (password.length < 6) {
      showAlert('Kata sandi minimal 6 karakter.');
      return;
    }

    btn.disabled = true;
    btn.textContent = 'Membuat akun...';

    setTimeout(() => {
      const users = JSON.parse(localStorage.getItem('vs_users') || '[]');
      if (users.find(u => u.email === email)) {
        showAlert('Email sudah terdaftar. Silakan masuk.');
        btn.disabled = false;
        btn.textContent = 'Buat Akun';
        return;
      }

      const newUser = { name, email, password: btoa(password), tier, createdAt: new Date().toISOString() };
      users.push(newUser);
      localStorage.setItem('vs_users', JSON.stringify(users));
      localStorage.setItem('vs_user', JSON.stringify({ name, email, tier }));

      showAlert('Akun berhasil dibuat! Mengalihkan...', 'success');
      setTimeout(() => window.location.href = 'studio.html', 1200);
    }, 700);
  }

  function registerWithGoogle() {
    const mockUser = {
      name: 'Demo User',
      email: 'demo@gmail.com',
      tier: 'free',
    };
    const users = JSON.parse(localStorage.getItem('vs_users') || '[]');
    if (!users.find(u => u.email === mockUser.email)) {
      users.push({ ...mockUser, password: btoa('google-oauth'), createdAt: new Date().toISOString() });
      localStorage.setItem('vs_users', JSON.stringify(users));
    }
    localStorage.setItem('vs_user', JSON.stringify(mockUser));
    window.location.href = 'studio.html';
  }
</script>
</body>
</html>
